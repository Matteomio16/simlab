name: Site

# Builds and deploys NotAPoll.org (site/). Production deploys only when the repository variable SITE_DEPLOY is "on"
# (Matteo's switch). SITE_MODE (prelaunch | forecast) and SITE_DATA (sample | live) are repository variables too;
# forecast mode in production needs Matteo's go (11 Oct). The preview always builds forecast mode on sample data; the
# launch-page preview was retired on 12 Oct, when the forecast went live.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci

      # Production first, so nothing the previews do can hold back notapoll.org (12 Oct: a Cloudflare 504 on the preview
      # deploy stopped the job before production). Each deploy is retried, since Cloudflare's API times out now and then.
      - name: Build production
        if: vars.SITE_DEPLOY == 'on'
        env:
          SITE_MODE: ${{ vars.SITE_MODE || 'prelaunch' }}
          SITE_DATA: ${{ vars.SITE_DATA || 'sample' }}
        run: |
          if [ "$SITE_MODE" = forecast ] && [ "$SITE_DATA" != live ]; then echo "forecast mode in production needs SITE_DATA=live"; exit 1; fi
          # Until the daily job's first publish lands, keep serving the prelaunch site.
          if [ "$SITE_MODE" = forecast ] && [ ! -f data/live/forecast.json ]; then
            echo "::warning::no site/data/live/forecast.json yet; building prelaunch"
            export SITE_MODE=prelaunch SITE_DATA=sample
          fi
          rm -rf out .next && npm run build && node scripts/check-copy.mjs
      - name: Deploy production
        if: vars.SITE_DEPLOY == 'on' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for i in 1 2 3 4; do
            npx --yes wrangler@4 deploy -c wrangler.jsonc && exit 0
            echo "::warning::production deploy attempt $i failed; retrying"
            sleep $((i * 30))
          done
          exit 1

      # The unlisted preview (forecast mode, sample data). Its failures are reported but never fail the run.
      - name: Build preview (forecast mode, sample data)
        id: preview_build
        continue-on-error: true
        env:
          SITE_MODE: forecast
          SITE_DATA: sample
          SITE_PREVIEW: "1"
        run: rm -rf out .next && npm run build && node scripts/check-copy.mjs
      - name: Deploy preview
        if: steps.preview_build.outcome == 'success' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            npx --yes wrangler@4 deploy -c wrangler.preview.jsonc && exit 0
            echo "::warning::preview deploy attempt $i failed; retrying"
            sleep $((i * 30))
          done
          exit 1
