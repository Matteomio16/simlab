# Every 15 minutes: news snapshots (simlab/newsnap.py) into the private data repo's news/ folder. GDELT for every race
# and the nation: only the most overdue queries, within about 9 minutes, because GDELT refuses an address for minutes
# after one success and each run gets a fresh one. Media Cloud alongside, paced to its limit (2 requests a minute,
# 4,000 a week; the key rides in a header). Plus the state outlets' RSS feeds. GitHub drops many scheduled
# triggers; a missed run is made up by the next, because a query saved in the last 6 hours isn't asked again and every
# query covers 24 hours. The deploy key can write to Matteomio16/simlab-data only. Logs print counts, never data.
name: news

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

concurrency:
  group: news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Matteomio16/simlab-data
          ssh-key: ${{ secrets.SIMLAB_DATA_DEPLOY_KEY }}
          path: data-repo
          fetch-depth: 1
          sparse-checkout: /README.md
          sparse-checkout-cone-mode: false
      - name: The last days' news manifests and the latest race tiers
        working-directory: data-repo
        run: |
          set -f  # the patterns' * are for git, not the shell
          paths=$(for k in 0 1 2; do echo "/news/$(date -u -d "-$k day" +%F)/*/manifest.json"; done)
          latest=$(git ls-tree -d --name-only HEAD derived/ 2>/dev/null | sort | tail -1)
          git sparse-checkout add $paths ${latest:+/$latest/races.json}
          echo "RACES=${latest:+data-repo/$latest/races.json}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet requests
      - name: News
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: python -m simlab.newsnap --out data-repo/news --budget 540 ${RACES:+--races "$RACES"}
      - name: Push to the data repo
        working-directory: data-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse news
          git commit --quiet -m "News $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do
            git pull --quiet --rebase && git push --quiet && exit 0
            sleep 15
          done
          exit 1
      - name: Missed day?
        # A day whose daily run never started sends no failure email of its own. From 12:00 to 12:29 UTC (the run
        # starts at 09:47), a day without derived/<day>/run.json fails this step, so GitHub emails Matteo.
        if: ${{ !cancelled() && vars.PIPELINE_ON == 'true' }}
        working-directory: data-repo
        run: |
          day=$(date -u +%F); now=$(date -u +%H%M)
          if [[ ! "$day" < "2026-10-01" ]] && (( 10#$now >= 1200 && 10#$now < 1230 )); then
            git fetch --quiet --depth 1 origin HEAD
            if git cat-file -e "FETCH_HEAD:derived/${day}/run.json" 2>/dev/null; then echo "${day} has run"
            else echo "no daily run for ${day} by $(date -u +%H:%M) UTC"; exit 1; fi
          fi
