# Once a day from 09:47 UTC: news -> reactions -> statistics -> post kit (simlab/daily.py), outputs committed to the
# private data repo (derived/<date>/). GitHub fires this repository's schedules only every 5-9 hours (28-29 Sep), so an
# outside timer (ops/cron, a Cloudflare Worker) starts the run with scheduled=true at 09:47; GitHub's own triggers,
# every 15 minutes until 14:47, stay as a fallback. A scheduled run only proceeds when it is past 09:47 UTC, the day
# has no run.json yet, the day is 1 Oct or later (the pilot's first runs) and the repository variable PIPELINE_ON is
# "true"; a manual run works any time. Logs are public: the steps print statuses and counts, never data. Package versions come from uv.lock.
# From 12 Oct the publish job copies the day's public files to the site once Matteo switches SITE_PUBLISH on.
# full_rehearsal=true (7 Oct, Matteo's yes) runs every race on a copy of the data and saves it to rehearsal/<day>-all/,
# so the day's own record stays as the pilot left it; a rehearsal is never published. Each run then checks the pass
# criteria (simlab/rehearsal.py; a miss fails the run, so GitHub emails Matteo), and the calendar job starts the
# planned extras: Sunday's drills on 4 Oct, the full-scale rehearsal on 7 Oct.
name: daily

on:
  schedule:
    - cron: "47 9 * * *"
    - cron: "2,17,32,47 10-14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to run (YYYY-MM-DD, default today UTC)"
        required: false
      scheduled:
        description: "Started by the outside timer: obey PIPELINE_ON and run once a day"
        type: boolean
        default: false
      full_rehearsal:
        description: "Every race (scope all) on a copy, saved to rehearsal/<date>-all/; the day's record is untouched"
        type: boolean
        default: false

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    if: (github.event_name == 'workflow_dispatch' && !inputs.scheduled) || vars.PIPELINE_ON == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      day: ${{ steps.public.outputs.day }}
      publish: ${{ steps.public.outputs.publish }}
      pushed: ${{ steps.push.outcome }}
      ran_day: ${{ steps.day.outputs.day }}
    env:
      REHEARSAL: ${{ inputs.full_rehearsal }}
    steps:
      - uses: actions/checkout@v4
      - name: Day
        id: day
        run: |
          d="${{ inputs.date }}"
          echo "DAY=${d:-$(date -u +%F)}" >> "$GITHUB_ENV"
          echo "day=${d:-$(date -u +%F)}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Matteomio16/simlab-data
          ssh-key: ${{ secrets.SIMLAB_DATA_DEPLOY_KEY }}
          path: data-repo
          fetch-depth: 1
          sparse-checkout: |
            /README.md
            /derived/
            /house/
          sparse-checkout-cone-mode: false
      - name: Due?
        id: due
        if: github.event_name == 'schedule' || inputs.scheduled
        working-directory: data-repo
        run: |
          # the pilot's daily runs start on Thu 1 Oct (Matteo, 29 Sep), whenever PIPELINE_ON was switched on
          # a trigger delayed past midnight must not run the new day before its news window closes (09:30 UTC)
          if [[ "$DAY" < "2026-10-01" ]]; then
            echo "scheduled runs start on 2026-10-01"; echo "run=false" >> "$GITHUB_OUTPUT"
          elif (( 10#$(date -u +%H%M) < 947 )); then
            echo "before 09:47 UTC"; echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -f "derived/${DAY}/run.json" ]; then
            echo "${DAY} has already run"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The day's snapshots (its news window starts the day before; repeats are looked up 2 days back)
        if: steps.due.outputs.run != 'false'
        working-directory: data-repo
        run: git sparse-checkout add $(for k in 2 1 0; do d=$(date -u -d "$DAY -$k day" +%F); echo "/snapshots/$d/ /news/$d/"; done)
      - uses: astral-sh/setup-uv@v6
        if: steps.due.outputs.run != 'false'
      - run: uv sync --frozen
        if: steps.due.outputs.run != 'false'
      - uses: actions/cache@v4
        if: steps.due.outputs.run != 'false'
        with:
          path: runs/cache.sqlite
          key: llm-cache-${{ env.DAY }}-${{ github.run_id }}
          restore-keys: llm-cache-${{ env.DAY }}-
      - name: Run the day
        if: steps.due.outputs.run != 'false'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KEV_API_KEY: ${{ secrets.KEV_API_KEY }}
          SIMLAB_BUDGET_USD: "2"
        # Kev answers as shadow rows (never applied) when the KEV_URL repository variable is set (Matteo, 29 Sep)
        run: |
          data=data-repo scope=
          if [ "$REHEARSAL" = true ]; then
            cp -r data-repo/. rehearsal-data && rm -rf rehearsal-data/.git "rehearsal-data/derived/${DAY}"
            data=rehearsal-data scope="--scope all"
          fi
          uv run python -m simlab.daily --date "$DAY" --data "$data" $scope --kev "${{ vars.KEV_URL }}"
      - name: Push outputs to the data repo
        id: push
        if: always() && steps.due.outputs.run != 'false'
        working-directory: data-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$REHEARSAL" = true ]; then
            git sparse-checkout add /rehearsal/
            rm -rf "rehearsal/${DAY}-all" && mkdir -p rehearsal && cp -r "../rehearsal-data/derived/${DAY}" "rehearsal/${DAY}-all"
            git add --sparse rehearsal
            msg="Full-scale rehearsal ${DAY}"
          else
            git add --sparse derived
            msg="Daily run ${DAY}"
          fi
          git commit --quiet -m "$msg" || exit 0
          for i in 1 2 3; do
            git pull --quiet --rebase && git push --quiet && exit 0
            sleep 15
          done
          exit 1
      - name: Public?
        id: public
        if: ${{ !cancelled() && vars.SITE_PUBLISH == 'on' && !inputs.full_rehearsal && steps.push.outcome == 'success' }}
        working-directory: data-repo
        # a failed post kit doesn't hold the site back; a failed news, reactions or statistics step leaves the site on
        # the previous day
        run: |
          if [[ "$DAY" < "2026-10-12" ]]; then
            echo "the site publishes from 2026-10-12"
          elif [[ "$DAY" > "$(date -u +%F)" ]]; then
            echo "${DAY} has not started"
          elif ! jq -e '.steps[] | select(.name == "statistics" and .status == "ok")' "derived/${DAY}/run.json" > /dev/null; then
            echo "statistics did not pass"
          else
            echo "day=${DAY}" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pass criteria (docs/rehearsal.md)
        # after the outputs are saved and the site decision is made: a miss fails the run, so GitHub emails Matteo
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        run: |
          data=data-repo; [ "$REHEARSAL" = true ] && data=rehearsal-data
          uv run python -m simlab.rehearsal check-day --date "$DAY" --data "$data"

  # The rehearsal calendar (docs/rehearsal.md), started by the day's scheduled run so that nobody needs to be at a
  # laptop: Sunday's drills on 4 Oct, the full-scale rehearsal on 7 Oct (both after that day's own run).
  calendar:
    needs: daily
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.scheduled) && needs.daily.outputs.pushed == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      DAY: ${{ needs.daily.outputs.ran_day }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Anything planned today?
        run: |
          case "$DAY" in
            2026-10-04) gh workflow run drills.yml -R "$GITHUB_REPOSITORY" -f date="$DAY" ;;
            2026-10-07) gh workflow run daily.yml -R "$GITHUB_REPOSITORY" -f date="$DAY" -f full_rehearsal=true ;;
            *) echo "nothing planned for ${DAY}" ;;
          esac

  # The site's daily files (Website session; approved by Matteo 29 Sep, for 12 Oct after his 11 Oct go). A job of its
  # own, so only this short step holds a token that can write to this public repository. Only forecast.json, draws.json
  # and races.json (without tier_reasons) are checked out of the data repo; site/scripts/publish-day.mjs copies them to
  # site/data/live/ and site/public/data/<day>/.
  publish:
    needs: daily
    if: ${{ !cancelled() && vars.SITE_PUBLISH == 'on' && needs.daily.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      DAY: ${{ needs.daily.outputs.day }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: Matteomio16/simlab-data
          ssh-key: ${{ secrets.SIMLAB_DATA_DEPLOY_KEY }}
          path: data-repo
          fetch-depth: 1
          sparse-checkout: |
            /derived/${{ needs.daily.outputs.day }}/forecast.json
            /derived/${{ needs.daily.outputs.day }}/draws.json
            /derived/${{ needs.daily.outputs.day }}/races.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live=$(node -p 'require("./site/data/live/history.json").date ?? ""' 2>/dev/null || true)
          if [[ "$DAY" < "$live" ]]; then echo "the site already shows ${live}; ${DAY} stays unpublished"; exit 0; fi
          node site/scripts/publish-day.mjs --from "data-repo/derived/${DAY}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/live "site/public/data/${DAY}"
          git commit --quiet -m "Publish ${DAY}" || exit 0
          for i in 1 2 3; do
            # a push made with this job's token starts no workflow, so the Site workflow is started here
            git pull --quiet --rebase && git push --quiet && gh workflow run site.yml --ref main && exit 0
            sleep 15
          done
          exit 1
