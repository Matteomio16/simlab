# Every 3 hours: raw snapshots of live sources (simlab/snap.py) into the private data repo.
# GitHub drops most scheduled triggers (3 of the first 4 three-hourly slots on 28 Sep; then only 3 of ~17 hourly ones),
# so the trigger fires every 15 minutes and a scheduled run only proceeds when the newest snapshot is at least 150
# minutes old. The Cloudflare Worker in ops/cron dispatches it every 3 hours with scheduled=true, which obeys the same
# rule; manual runs always proceed.
# The deploy key in SIMLAB_DATA_DEPLOY_KEY can write to Matteomio16/simlab-data only. Logs are public: the script
# prints sizes and errors, never data.
name: snapshot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "obey the 150-minute rule, as a scheduled run does"
        default: "false"

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Matteomio16/simlab-data
          ssh-key: ${{ secrets.SIMLAB_DATA_DEPLOY_KEY }}
          path: data-repo
          fetch-depth: 1
          sparse-checkout: /README.md
          sparse-checkout-cone-mode: false
      - name: Due?
        id: due
        if: github.event_name == 'schedule' || inputs.scheduled == 'true'
        working-directory: data-repo
        run: |
          day=$(git ls-tree --name-only HEAD snapshots/ | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -1)
          run=$(git ls-tree --name-only HEAD "$day/" | sort | tail -1)
          last=$(date -u -d "$(basename "$day") $(basename "$run" | sed 's/^\(..\)/\1:/')" +%s)
          age=$(( ($(date -u +%s) - last) / 60 ))
          echo "newest snapshot: ${age} minutes old"
          if [ "$age" -ge 150 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.due.outputs.run != 'false'
        with:
          python-version: "3.13"
      - run: pip install --quiet requests
        if: steps.due.outputs.run != 'false'
      - name: Snapshot
        if: steps.due.outputs.run != 'false'
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: python -m simlab.snap --out data-repo/snapshots
      - name: Push to the data repo
        if: steps.due.outputs.run != 'false'
        working-directory: data-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse snapshots
          git commit --quiet -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --quiet --rebase && git push --quiet && exit 0
            sleep 15
          done
          exit 1
